name: Conference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python -m pip install -e .
      - run: python ae/verify_sha256.py ae/expected-results/SHA256SUMS
      - run: bash ae/run_quick.sh
  simulator-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build patch pkg-config protobuf-compiler libprotobuf-dev libyaml-cpp-dev
      - run: python -m pip install -e .
      - run: JOBS=4 bash scripts/build_simulators.sh
      - run: ulimit -n 8192 && python ae/check_env.py --full
